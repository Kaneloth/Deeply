kind = "web"
previewPath = "/"
title = "Pulse"
version = "1.0.0"
id = "artifacts/pulse-app"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23220

[services.development]
run = "pnpm --filter @workspace/pulse-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/pulse-app", "run", "build" ]
serve = "static"
publicDir = "artifacts/pulse-app/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23220"
BASE_PATH = "/"
