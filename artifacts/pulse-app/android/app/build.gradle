apply plugin: 'com.android.application'

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "za.co.deeplydating.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "za.co.deeplydating.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 35
        versionName "1.0.4"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            // Only configured if keystore.properties actually exists —
            // lets assembleDebug (and anyone cloning this repo without
            // the real keystore) keep working unaffected. Real values
            // live in keystore.properties, which is gitignored — never
            // hardcode passwords directly in this file, since this file
            // itself IS committed to the repo.
            if (keystorePropertiesFile.exists()) {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            // Was false — confirmed direct cause of Play Console's
            // "App optimization is below our threshold (Obfuscation 1%)"
            // warning. This is the actual setting controlling R8
            // minification/obfuscation for release builds; a
            // proguard-rules.pro file already exists and is already
            // wired in below, but with minification off it was never
            // actually being applied. IMPORTANT: enabling this needs a
            // full, thorough test of a release build before shipping —
            // R8 can strip or rename classes that reflection-based
            // native code (Capacitor plugins, WebView bridge classes)
            // depends on existing under their original names, if the
            // existing proguard-rules.pro doesn't already have complete
            // keep rules for all of them. Test assembleRelease/
            // bundleRelease thoroughly (all native plugin functionality
            // — camera, video calls, permissions, etc.) before treating
            // this as safe to publish.
            minifyEnabled true
            // Separate setting from minifyEnabled — that one shrinks/
            // obfuscates CODE; this one removes unused RESOURCES
            // (images, layouts, strings) that minifyEnabled alone
            // doesn't touch. Requires minifyEnabled true to already be
            // set, which it now is. Addresses the "Resource shrinking
            // isn't enabled" part of Play Console's R8 optimization
            // recommendation. Same testing caveat as minifyEnabled
            // above applies — verify a release build still has every
            // resource it actually needs (icons, drawables referenced
            // only from native code or WebView assets) before shipping.
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.activity:activity:1.12.4"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}